<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Matching Jobs | SmartRecruitment</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/jobs.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">S</div>
          SmartRecruitment
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">👤</span> My Profile & Skills
        </a>
        <a href="jobs.html" class="nav-item active">
          <span class="nav-icon">🔍</span> Discover Jobs
        </a>
        <a href="applications.html" class="nav-item">
          <span class="nav-icon">📄</span> My Applications
        </a>
        <a href="contact-requests.html" class="nav-item">
          <span class="nav-icon">✉️</span> Contact Requests
        </a>
        <a href="notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Notifications
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-item" style="width:100%; border:none; background:none;">
          <span class="nav-icon">🚪</span> Logout
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div class="flex items-center gap-3">
          <span id="mobile-toggle" class="mobile-menu-toggle">☰</span>
          <h2 class="header-title">Discover Vacancies</h2>
        </div>
        <div class="header-actions">
          <a href="notifications.html" style="position:relative; font-size:1.25rem;">
            🔔 <span id="notification-badge" class="badge badge-rejected hidden" style="position:absolute; top:-5px; right:-8px; padding:0.1rem 0.4rem;">0</span>
          </a>
          <div class="user-profile-badge">
            <div id="header-user-avatar" class="user-avatar">U</div>
            <div class="user-info-text">
              <span id="header-user-name" class="user-name">User</span>
              <span id="header-user-role" class="user-role-label">JobSeeker</span>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content">
        <!-- Search Controls -->
        <div class="card" style="margin-bottom: 2rem;">
          <form id="search-form" class="grid grid-cols-3" style="gap:1rem; align-items:flex-end;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="search-keyword">Job Title or Keyword</label>
              <input type="text" id="search-keyword" class="form-control" placeholder="e.g. Developer, C#, React">
            </div>

            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="search-location">Location</label>
              <input type="text" id="search-location" class="form-control" placeholder="e.g. Colombo, Remote">
            </div>

            <div class="flex gap-2">
              <button type="submit" class="btn btn-primary" style="flex:1;">Search Jobs</button>
              <button type="button" id="reset-search-btn" class="btn btn-secondary">Reset</button>
            </div>
          </form>
        </div>

        <!-- Jobs Grid Container -->
        <div id="jobs-container" class="grid grid-cols-2">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/jobseeker/jobs.js"></script>
</body>
</html>
