<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications | SmartRecruitment</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">S</div>
          SmartRecruitment
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">👤</span> My Profile & Skills
        </a>
        <a href="jobs.html" class="nav-item">
          <span class="nav-icon">🔍</span> Discover Jobs
        </a>
        <a href="applications.html" class="nav-item active">
          <span class="nav-icon">📄</span> My Applications
        </a>
        <a href="contact-requests.html" class="nav-item">
          <span class="nav-icon">✉️</span> Contact Requests
        </a>
        <a href="notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Notifications
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-item" style="width:100%; border:none; background:none;">
          <span class="nav-icon">🚪</span> Logout
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div class="flex items-center gap-3">
          <span id="mobile-toggle" class="mobile-menu-toggle">☰</span>
          <h2 class="header-title">My Application History</h2>
        </div>
        <div class="header-actions">
          <a href="notifications.html" style="position:relative; font-size:1.25rem;">
            🔔 <span id="notification-badge" class="badge badge-rejected hidden" style="position:absolute; top:-5px; right:-8px; padding:0.1rem 0.4rem;">0</span>
          </a>
          <div class="user-profile-badge">
            <div id="header-user-avatar" class="user-avatar">U</div>
            <div class="user-info-text">
              <span id="header-user-name" class="user-name">User</span>
              <span id="header-user-role" class="user-role-label">JobSeeker</span>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content">
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Applied Date</th>
                <th>Match Score</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="applications-table-body">
              <tr>
                <td colspan="6" class="text-center"><div class="spinner"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/jobseeker/applications.js"></script>
</body>
</html>
