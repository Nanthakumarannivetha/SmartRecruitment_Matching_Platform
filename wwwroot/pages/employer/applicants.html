<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranked Applicants | SmartRecruitment</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/jobs.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">S</div>
          SmartRecruitment
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">🏢</span> Company Profile
        </a>
        <a href="vacancies.html" class="nav-item active">
          <span class="nav-icon">📢</span> Job Vacancies
        </a>
        <a href="create-vacancy.html" class="nav-item">
          <span class="nav-icon">➕</span> Post New Vacancy
        </a>
        <a href="contact-requests.html" class="nav-item">
          <span class="nav-icon">✉️</span> Candidate Responses
        </a>
        <a href="notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Notifications
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-item" style="width:100%; border:none; background:none;">
          <span class="nav-icon">🚪</span> Logout
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div class="flex items-center gap-3">
          <span id="mobile-toggle" class="mobile-menu-toggle">☰</span>
          <h2 id="applicants-page-title" class="header-title">Ranked Applicants</h2>
        </div>
        <div class="header-actions">
          <a href="vacancies.html" class="btn btn-secondary btn-sm">← Back to Vacancies</a>
          <div class="user-profile-badge">
            <div id="header-user-avatar" class="user-avatar">E</div>
            <div class="user-info-text">
              <span id="header-user-name" class="user-name">Employer</span>
              <span id="header-user-role" class="user-role-label">Employer</span>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content">
        <div class="card" style="margin-bottom:1.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <h3 id="job-title-header">Applicants Pipeline</h3>
              <p class="text-muted" style="font-size:0.875rem;">Candidates automatically ranked by suitability match score.</p>
            </div>
          </div>
        </div>

        <div class="card">
          <div id="applicants-table-container">
            <div class="spinner"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/employer/applicants.js"></script>
</body>
</html>
