<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile | SmartRecruitment</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/profile.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">S</div>
          SmartRecruitment
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="profile.html" class="nav-item active">
          <span class="nav-icon">🏢</span> Company Profile
        </a>
        <a href="vacancies.html" class="nav-item">
          <span class="nav-icon">📢</span> Job Vacancies
        </a>
        <a href="create-vacancy.html" class="nav-item">
          <span class="nav-icon">➕</span> Post New Vacancy
        </a>
        <a href="contact-requests.html" class="nav-item">
          <span class="nav-icon">✉️</span> Candidate Responses
        </a>
        <a href="notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Notifications
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-item" style="width:100%; border:none; background:none;">
          <span class="nav-icon">🚪</span> Logout
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div class="flex items-center gap-3">
          <span id="mobile-toggle" class="mobile-menu-toggle">☰</span>
          <h2 class="header-title">Company Profile Details</h2>
        </div>
        <div class="header-actions">
          <a href="notifications.html" style="position:relative; font-size:1.25rem;">
            🔔 <span id="notification-badge" class="badge badge-rejected hidden" style="position:absolute; top:-5px; right:-8px; padding:0.1rem 0.4rem;">0</span>
          </a>
          <div class="user-profile-badge">
            <div id="header-user-avatar" class="user-avatar">E</div>
            <div class="user-info-text">
              <span id="header-user-name" class="user-name">Employer</span>
              <span id="header-user-role" class="user-role-label">Employer</span>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content" style="max-width:850px;">
        <div class="profile-section">
          <div class="profile-section-header">
            <h3>Organization Information</h3>
          </div>

          <form id="employer-profile-form">
            <div class="form-group">
              <label class="form-label" for="company-name">Company Name *</label>
              <input type="text" id="company-name" class="form-control" required placeholder="Acme Technologies Inc.">
            </div>

            <div class="grid grid-cols-2">
              <div class="form-group">
                <label class="form-label" for="location">Headquarters Location</label>
                <input type="text" id="location" class="form-control" placeholder="Colombo, Sri Lanka">
              </div>

              <div class="form-group">
                <label class="form-label" for="website">Official Website URL</label>
                <input type="url" id="website" class="form-control" placeholder="https://company.com">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="description">Company Description</label>
              <textarea id="description" class="form-control" rows="4" placeholder="Brief overview of your company, tech stack, and workplace culture..."></textarea>
            </div>

            <button type="submit" id="save-btn" class="btn btn-primary">Save Company Profile</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/employer/profile.js"></script>
</body>
</html>
